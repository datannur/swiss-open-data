name: Build and deploy catalog

# Adapted from datannur/datannur-template and, like it, published on GitHub
# Pages (swiss-demo.datannur.com). The main difference: our data is not
# committed. `src/i14y.py` fetches it from the i14y API at build time, so a
# fetch step runs before datannurpy. Pages serves static files only, so the
# app uses #/ routing and the PHP APIs (REST, LLM chat) are not published.
#
# On pull requests only the `check` job runs (lint, type-check, a metadata-only
# smoke build) so nothing is fetched at scale or deployed. Pushes to main, the
# weekly schedule and manual runs go through the full fetch -> build -> deploy.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      refresh:
        description: "Refresh i14y data (schedule-parity run)"
        type: boolean
        default: false
      reset_evolution:
        description: "Restart the evolution table from a blank baseline"
        type: boolean
        default: false
  schedule:
    - cron: "39 3 * * 1"

permissions:
  contents: read

concurrency:
  group: catalog-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v8.3.2
        with:
          enable-cache: true

      # Float datannurpy to its latest release each run (template-style): the
      # bundled app version tracks it, so the deployed catalog stays current.
      # Everything else stays pinned by uv.lock. A regression that errors fails
      # this build before the deploy step ever runs.
      - run: uv sync --upgrade-package datannurpy

      - name: Lint and type-check
        run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run pyright

      # Reuse the i14y API cache (shared key with build). The smoke test
      # fetches the full dataset listing plus every concept and classification —
      # limit-invariant work — so without a cache each run pays ~2 min of live
      # API calls. A stale cache is fine here: this validates the code path, not
      # data freshness.
      - uses: actions/cache@v6
        with:
          path: staging/i14y
          key: i14y-smoke-${{ github.run_id }}
          restore-keys: i14y-smoke-

      - name: Smoke-test the i14y pipeline (metadata only)
        run: uv run python -u src/i14y.py --limit 12 --no-download

  build:
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # Safety net: GitHub's default job timeout is 6h. Fail fast instead so a
    # stalled i14y host can never burn hours.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v8.3.2
        with:
          enable-cache: true

      # Float datannurpy to its latest release each run (template-style): the
      # bundled app version tracks it, so the deployed catalog stays current.
      # Everything else stays pinned by uv.lock. A regression that errors fails
      # this build before the deploy step ever runs.
      - run: uv sync --upgrade-package datannurpy

      # Persist three things between runs so the weekly rebuild is fast and
      # gentle on the i14y API:
      #   - staging/i14y : cached API responses (reruns are offline)
      #   - data         : downloaded files (download_file skips existing ones;
      #     on schedule --refresh-data re-checks them, see below)
      #   - catalog/data/db : the exported db, incl. the incremental scan base
      #     (_scan) and the evolution table. Caching the whole db (not just _scan)
      #     lets datannurpy compare each build against the previous one, so the
      #     evolution table accumulates real changes across runs (e.g. what moved
      #     in i14y between weekly refreshes). The first run after this cache was
      #     seeded starts from a blank evolution, then it grows from there.
      - uses: actions/cache@v6
        with:
          path: |
            staging/i14y
            data
            catalog/data/db
          # Distinct prefix from the check job's i14y-smoke-* caches: a bare
          # `i14y-` restore-key also prefix-matches those metadata-only caches,
          # so a smoke cache newer than the last full cache would restore the
          # metadata WITHOUT the data/ files and force a full re-download.
          key: i14y-build-${{ github.run_id }}
          restore-keys: i14y-build-

      # The i14y API cache has no TTL, so a scheduled run that reused it would
      # redeploy frozen metadata. On the weekly schedule, drop it so new and
      # changed datasets are actually picked up. data/ is NOT dropped: the
      # schedule instead passes --refresh-data, which re-downloads every file
      # but rewrites only those whose content changed. Unchanged files keep
      # their mtime (so the kept scan cache in catalog/data/db skips them, and
      # the evolution table records only real changes), and a host that is down
      # that morning falls back to last week's file instead of deploying the
      # dataset hollow. Push and manual runs keep all caches for speed; a manual
      # run with the refresh input set behaves like a scheduled one.
      # The termdat/ subdir is spared: those entries are refreshed in place by
      # --refresh-data (rewritten only on success), so a termdat outage keeps
      # last week's definitions instead of dropping them for a week.
      - name: Refresh i14y metadata on schedule
        if: github.event_name == 'schedule' || inputs.refresh
        run: |
          find staging/i14y -mindepth 1 -maxdepth 1 -not -name termdat \
            -exec rm -rf {} + 2>/dev/null || true

      # One-shot baseline reset (manual runs only): drop the cached db —
      # previous table state, _scan and the accumulated evolution — so this
      # build exports a blank evolution whose baseline is the current data.
      # Costs one full re-scan; data/ and its download fallback are kept.
      # Caches are branch-scoped, so run this from main or it won't stick.
      - name: Reset evolution baseline
        if: inputs.reset_evolution
        run: rm -rf catalog/data/db

      # -u keeps stdout unbuffered so progress is visible live through `tee`
      # (block buffering otherwise makes the step look frozen). The step timeout
      # pins a stall to this step rather than the whole job.
      - name: Fetch i14y metadata and download files
        timeout-minutes: 25
        # pipefail: without it the pipe's exit code is tee's (always 0), which
        # would hide a fetch failure and only surface downstream.
        run: |
          set -o pipefail
          uv run python -u src/i14y.py --drop-blocked-hosts \
            ${{ (github.event_name == 'schedule' || inputs.refresh) && '--refresh-data' || '' }} \
            2>&1 | tee build.log

      - name: Build the datannur catalog
        # pipefail so a datannurpy failure fails this step instead of being
        # masked by tee and only surfacing later (e.g. a missing catalog/ at dcat).
        # mkdir: datannurpy writes catalog.yml's log_file without creating its
        # parent dir, which does not exist on a fresh runner.
        run: |
          set -o pipefail
          mkdir -p staging/logs
          uv run python -m datannurpy catalog.yml 2>&1 | tee -a build.log

      - name: Write job summary
        if: always()
        shell: bash
        run: |
          {
            echo '### Catalog build'
            echo '```'
            cat build.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # The app commands run under `uv run python` so sys.executable is the uv
      # venv, which carries their deps (jsonschema, rdflib, pyshacl, playwright);
      # bare python3 on the runner would not. A datannurpy regression that errors
      # fails one of these steps, which aborts the job before the deploy step.
      - name: Export DCAT and OpenAPI artifacts
        run: |
          uv run python catalog/datannur.py dcat
          uv run python catalog/datannur.py openapi

      # Publish only what a static host can serve. Pages has no PHP and ignores
      # .htaccess, so drop the server-side APIs (app/api: REST, LLM proxy), the
      # Apache rules, and the local-only helpers and configs that the former
      # rsync deploy excluded.
      - name: Prepare the Pages artifact
        run: |
          rm -rf catalog/app/api catalog/app/scripts/python \
            catalog/app/scripts/windows catalog/app/data-template
          find catalog -name .htaccess -delete
          rm -f catalog/data/deploy.config.json catalog/data/llm-web.config.json \
            catalog/data/localhost-ports.config.json \
            catalog/data/static-make.config.json catalog/data/update-app.json \
            catalog/data/jsonjsdb-config.html

      - uses: actions/upload-pages-artifact@v5
        with:
          path: catalog

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
